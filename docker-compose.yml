services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_hortifruti
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env.example
    ports: ["3000:3000"]
    depends_on: [postgres, ai]
  ai:
    build: ./ai
    ports: ["8000:8000"]
volumes:
  postgres_data:
